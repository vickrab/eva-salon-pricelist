<!DOCTYPE html>

<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Daftar harga dan treatment Eva Salon."
  >

  <title>
    Eva Salon - Price List
  </title>


  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"
  >


  <style>

    :root {

      --background:
        #f7f3ee;

      --surface:
        #fffdfa;

      --mint:
        #c7dccf;

      --mint-soft:
        #edf3ef;

      --sage:
        #7d998a;

      --sage-dark:
        #586f63;

      --gold:
        #c6a36c;

      --gold-light:
        #e5d1ab;

      --text:
        #342f2a;

      --muted:
        #827b73;

      --border:
        rgba(
          70,
          62,
          53,
          0.10
        );

      --shadow:
        0 14px 40px
        rgba(
          66,
          57,
          47,
          0.07
        );

    }


    * {

      box-sizing:
        border-box;

    }


    html {

      scroll-behavior:
        smooth;

    }


    body {

      margin: 0;

      min-height:
        100vh;

      font-family:
        "DM Sans",
        sans-serif;

      background:

        radial-gradient(
          circle at top right,
          rgba(
            199,
            220,
            207,
            0.42
          ),
          transparent 30%
        ),

        var(--background);

      color:
        var(--text);

    }


    .page {

      width:
        100%;

      max-width:
        620px;

      margin:
        0 auto;

      padding:
        32px
        18px
        60px;

    }



    /*
    ================================
    BRAND
    ================================
    */


    .brand {

      text-align:
        center;

      padding:
        10px 10px 42px;

    }


    .brand-mark {

      width:
        50px;

      height:
        50px;

      margin:
        0 auto 17px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      border:
        1px solid
        var(--gold-light);

      border-radius:
        50%;

      color:
        var(--gold);

      font-size:
        18px;

    }


    .brand h1 {

      margin: 0;

      font-family:
        "Playfair Display",
        serif;

      font-weight:
        500;

      font-size:
        40px;

      letter-spacing:
        -1.2px;

      color:
        #37312c;

    }


    .brand-description {

      max-width:
        370px;

      margin:
        12px auto 0;

      color:
        var(--muted);

      font-size:
        14px;

      line-height:
        1.75;

    }


    .brand-line {

      width:
        40px;

      height:
        1px;

      margin:
        24px auto 0;

      background:
        var(--gold);

    }



    /*
    ================================
    INTRO
    ================================
    */


    .intro {

      margin-bottom:
        28px;

    }


    .intro-small {

      margin-bottom:
        7px;

      color:
        var(--sage);

      font-size:
        11px;

      font-weight:
        600;

      letter-spacing:
        1.7px;

      text-transform:
        uppercase;

    }


    .intro h2 {

      margin:
        0 0 8px;

      font-family:
        "Playfair Display",
        serif;

      font-size:
        27px;

      font-weight:
        500;

    }


    .intro p {

      margin: 0;

      color:
        var(--muted);

      font-size:
        13px;

      line-height:
        1.6;

    }



    /*
    ================================
    CATEGORY
    ================================
    */


    .category {

      margin-bottom:
        36px;

      overflow:
        hidden;

      background:
        var(--surface);

      border:
        1px solid
        var(--border);

      border-radius:
        24px;

      box-shadow:
        var(--shadow);

    }


    .category-image-wrapper {

      position:
        relative;

      width:
        100%;

      height:
        220px;

      overflow:
        hidden;

      background:
        var(--mint-soft);

    }


    .category-image {

      width:
        100%;

      height:
        100%;

      display:
        block;

      object-fit:
        cover;

    }


    .category-image-wrapper::after {

      content:
        "";

      position:
        absolute;

      inset:
        0;

      background:

        linear-gradient(

          to top,

          rgba(
            30,
            29,
            26,
            0.68
          )
          0%,

          rgba(
            30,
            29,
            26,
            0.06
          )
          60%,

          transparent
          100%

        );

    }


    .category-heading {

      position:
        absolute;

      z-index:
        2;

      left:
        22px;

      right:
        22px;

      bottom:
        20px;

      color:
        white;

    }


    .category-label {

      margin-bottom:
        5px;

      font-size:
        10px;

      font-weight:
        600;

      letter-spacing:
        1.5px;

      text-transform:
        uppercase;

      opacity:
        0.82;

    }


    .category-title {

      margin: 0;

      font-family:
        "Playfair Display",
        serif;

      font-size:
        28px;

      font-weight:
        500;

      line-height:
        1.15;

    }


    .category-no-image {

      padding:
        27px 22px 17px;

      background:

        linear-gradient(
          135deg,
          var(--mint-soft),
          #f8f4ed
        );

    }


    .category-no-image
    .category-label {

      color:
        var(--sage);

      opacity:
        1;

    }


    .category-no-image
    .category-title {

      color:
        var(--text);

    }



    /*
    ================================
    SERVICES
    ================================
    */


    .services {

      padding:
        5px 22px;

    }


    .service {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        22px;

      padding:
        20px 0;

      border-bottom:
        1px solid
        var(--border);

    }


    .service:last-child {

      border-bottom:
        none;

    }


    .service-info {

      min-width: 0;

    }


    .service-name {

      font-family:
        "Playfair Display",
        serif;

      font-size:
        17px;

      font-weight:
        500;

      line-height:
        1.3;

    }


    .service-note {

      display:
        block;

      margin-top:
        5px;

      color:
        var(--muted);

      font-family:
        "DM Sans",
        sans-serif;

      font-size:
        11px;

      line-height:
        1.4;

    }


    .service-price {

      flex-shrink: 0;

      color:
        var(--gold);

      font-size:
        14px;

      font-weight:
        600;

      white-space:
        nowrap;

    }



    /*
    ================================
    LOADING
    ================================
    */


    .loading {

      padding:
        60px 20px;

      text-align:
        center;

      color:
        var(--muted);

      font-size:
        13px;

    }


    .loading-dot {

      width:
        38px;

      height:
        38px;

      margin:
        0 auto 16px;

      border:
        2px solid
        var(--mint);

      border-top-color:
        var(--gold);

      border-radius:
        50%;

      animation:
        spin 0.8s linear infinite;

    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }



    /*
    ================================
    ERROR
    ================================
    */


    .error {

      padding:
        20px;

      border:
        1px solid
        #ecd1d1;

      border-radius:
        17px;

      background:
        #fff3f3;

      color:
        #865c5c;

      font-size:
        13px;

      line-height:
        1.6;

    }



    /*
    ================================
    FOOTER
    ================================
    */


    footer {

      margin-top:
        48px;

      padding:
        0 15px;

      text-align:
        center;

      color:
        var(--muted);

      font-size:
        11px;

      line-height:
        1.8;

    }


    footer strong {

      color:
        var(--gold);

      font-weight:
        500;

    }



    /*
    ================================
    MOBILE
    ================================
    */


    @media
    (max-width: 480px) {


      .page {

        padding:
          27px
          15px
          50px;

      }


      .brand {

        padding-bottom:
          38px;

      }


      .brand h1 {

        font-size:
          37px;

      }


      .intro h2 {

        font-size:
          25px;

      }


      .category {

        border-radius:
          21px;

      }


      .category-image-wrapper {

        height:
          190px;

      }


      .category-heading {

        left:
          19px;

        bottom:
          18px;

      }


      .category-title {

        font-size:
          26px;

      }


      .services {

        padding:
          4px 18px;

      }


      .service {

        padding:
          18px 0;

      }


      .service-name {

        font-size:
          16px;

      }


      .service-price {

        font-size:
          13px;

      }

    }

  </style>

</head>



<body>


  <main class="page">


    <header class="brand">


      <div class="brand-mark">
        ✦
      </div>


      <h1>
        Eva Salon
      </h1>


      <p class="brand-description">

        Perawatan untuk kecantikan,
        kenyamanan, dan kepercayaan
        diri Anda.

      </p>


      <div class="brand-line"></div>


    </header>



    <section class="intro">


      <div class="intro-small">
        Price List
      </div>


      <h2>
        Our Treatments
      </h2>


      <p>

        Temukan perawatan yang sesuai
        untuk kebutuhan Anda.

      </p>


    </section>



    <div id="content">


      <div class="loading">

        <div class="loading-dot"></div>

        Memuat daftar layanan...

      </div>


    </div>



    <footer>

      Harga dapat berubah
      sewaktu-waktu.

      <br>

      Silakan konfirmasi kepada
      <strong>Eva Salon</strong>
      untuk informasi terbaru.

    </footer>


  </main>



  <script>
  const API_URL =
    'https://script.google.com/macros/s/AKfycbwRcpPFRXnySce9fhF7-FZEzJ85PuA6jiGU0SOmYIP8a12PR1XGUylHLuGGdhq3GrPF/exec';


  function formatRupiah(number) {
    return new Intl.NumberFormat('id-ID', {
      style: 'currency',
      currency: 'IDR',
      maximumFractionDigits: 0
    }).format(number);
  }


  function escapeHTML(value) {
    const div = document.createElement('div');

    div.textContent =
      value == null
        ? ''
        : String(value);

    return div.innerHTML;
  }


  function loadEvaSalonData(response) {
    console.log('DATA MASUK:', response);

    if (
      !response ||
      response.success !== true
    ) {
      showError(
        response?.message ||
        'Data tidak tersedia.'
      );

      return;
    }

    renderPriceList(response.data);
  }


  function renderPriceList(categories) {
    const container =
      document.getElementById('content');


    if (
      !categories ||
      categories.length === 0
    ) {
      container.innerHTML = `
        <div class="error">
          Belum ada layanan yang tersedia.
        </div>
      `;

      return;
    }


    let html = '';


    categories.forEach(category => {
      html += `
        <section class="category">
      `;


      if (category.image) {
        html += `
          <div class="category-image-wrapper">

            <img
              class="category-image"
              src="${escapeHTML(category.image)}"
              alt="${escapeHTML(category.name)}"
              loading="lazy"
            >

            <div class="category-heading">

              <div class="category-label">
                Treatment
              </div>

              <h3 class="category-title">
                ${escapeHTML(category.name)}
              </h3>

            </div>

          </div>
        `;
      }

      else {
        html += `
          <div class="category-no-image">

            <div class="category-label">
              Treatment
            </div>

            <h3 class="category-title">
              ${escapeHTML(category.name)}
            </h3>

          </div>
        `;
      }


      html += `
        <div class="services">
      `;


      category.services.forEach(service => {
        html += `
          <div class="service">

            <div class="service-info">

              <div class="service-name">
                ${escapeHTML(service.service)}
              </div>

              ${
                service.note
                  ? `
                    <span class="service-note">
                      ${escapeHTML(service.note)}
                    </span>
                  `
                  : ''
              }

            </div>


            <div class="service-price">
              ${formatRupiah(service.price)}
            </div>

          </div>
        `;
      });


      html += `
          </div>
        </section>
      `;
    });


    container.innerHTML = html;
  }


  function showError(message) {
    console.error('ERROR:', message);

    document.getElementById('content')
      .innerHTML = `
        <div class="error">
          Price list gagal dimuat.
          <br><br>
          Silakan coba kembali.
        </div>
      `;
  }


  function loadData() {
    const callbackName =
      'loadEvaSalonData';

    const script =
      document.createElement('script');

    const separator =
      API_URL.includes('?')
        ? '&'
        : '?';

    script.src =
      API_URL +
      separator +
      'callback=' +
      callbackName +
      '&t=' +
      Date.now();


    console.log(
      'Loading API:',
      script.src
    );


    script.onerror =
      function () {
        showError(
          'Gagal terhubung ke Apps Script.'
        );
      };


    document.body.appendChild(script);
  }


  window.loadEvaSalonData =
    loadEvaSalonData;


  window.addEventListener(
    'DOMContentLoaded',
    loadData
  );
</script>


</body>

</html>
